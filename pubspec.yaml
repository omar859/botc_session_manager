name: botc_session_manager
description: Offline Blood on the Clocktower session manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  stream_channel: ^2.1.2
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4
  shelf_static: ^1.1.2
  network_info_plus: ^4.1.0
  image_picker: ^1.0.7
  photo_view: ^0.14.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  uuid: ^4.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6
  file_picker: ^8.1.2
  path: ^1.9.0
  json_annotation: ^4.8.1
  permission_handler: ^11.3.1
  audioplayers: ^5.2.1
  record: 5.0.5
  path_provider: ^2.1.4
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.1

dependency_overrides:
  # record_android 1.5.x expects a newer Flutter Gradle integration than the
  # Flutter 3.24 project uses. This implementation keeps the same recorder API
  # while using an explicit compile SDK.
  record_android: 1.3.3
  record_platform_interface: 1.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
    - assets/data/roles.json
    - assets/web_client/index.html
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1E1E2E"   # (optional) for Android adaptive icons
  adaptive_icon_foreground: "assets/icon/icon.png"  # (optional)
